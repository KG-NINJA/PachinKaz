<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>PachinCaz</title>
  <style>
    :root { --cyan:#54f7ff; --pink:#ff2d75; --gold:#ffd84d; --ink:#050614; --green:#33ff99; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--ink); color:#fff; }
    body,button { font-family:Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; }
    .stage { width:100%; height:100svh; height:100dvh; display:grid; place-items:center; padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left)); background:radial-gradient(circle at 50% 28%,#263e82,#071129 68%,#050614); }
    .cabinet { position:relative; width:min(520px,100%); height:100%; max-height:920px; overflow:hidden; border:3px solid var(--cyan); border-radius:28px; background:#070a1b; box-shadow:0 0 14px var(--cyan),0 0 45px #54f7ff44,inset 0 0 35px #ff2d7522; }
    .hud { height:84px; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; border-bottom:2px solid #ffffff33; background:linear-gradient(90deg,#142057,#34133e,#142057); }
    h1 { margin:0; font-size:clamp(30px,8vw,48px); font-style:italic; line-height:.9; text-shadow:4px 4px 0 var(--pink),-2px -2px 0 var(--cyan); }
    .stats { min-width:150px; text-align:right; color:var(--gold); font:900 12px/1.45 Arial,sans-serif; letter-spacing:.12em; }
    .board { position:absolute; inset:84px 0 116px; overflow:hidden; background:linear-gradient(#05061400 0 70%,#050614bb),repeating-linear-gradient(0deg,#0c1230 0 2px,#091026 2px 28px); }
    .board::before { content:""; position:absolute; inset:-20%; opacity:.22; background:repeating-conic-gradient(from 0deg at 50% 45%,#54f7ff 0 1deg,transparent 1.5deg 9deg); animation:aura 18s linear infinite; }
    canvas { position:relative; z-index:2; display:block; width:100%; height:100%; touch-action:none; }
    .board.level-scroll canvas,
    .board.level-scroll .reels,
    .board.level-scroll .message {
      animation:boardAscend 1.35s cubic-bezier(.12,.78,.2,1) both;
    }
    .reels { position:absolute; z-index:3; left:50%; top:36%; transform:translate(-50%,-70%) scale(.82); width:68%; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:9px; border:3px solid var(--gold); border-radius:16px; background:#05050ddd; box-shadow:0 0 22px #ffd84d88,inset 0 0 18px #000; pointer-events:none; opacity:0; transition:opacity .22s,transform .28s cubic-bezier(.12,.85,.22,1); }
    .reels.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
    .reel { aspect-ratio:1; display:grid; place-items:center; overflow:hidden; border:2px solid #4b5380; border-radius:10px; background:linear-gradient(#151729,#fff 15%,#dce9ff 50%,#fff 85%,#151729); }
    .symbol { color:#17182b; font-family:"Segoe UI Emoji",sans-serif; font-size:clamp(34px,10vw,62px); filter:drop-shadow(0 3px 1px #0005); }
    .reel.spin .symbol { animation:spin .12s linear infinite; filter:blur(2px); }
    .reel.lock { border-color:var(--gold); box-shadow:0 0 12px var(--gold); }
    .message { position:absolute; z-index:4; left:50%; top:55%; transform:translateX(-50%); width:92%; text-align:center; pointer-events:none; color:var(--gold); font-size:clamp(20px,6vw,36px); font-style:italic; letter-spacing:.08em; text-shadow:4px 4px 0 #000,0 0 18px currentColor; }
    .rise { position:absolute; inset:0; z-index:6; pointer-events:none; opacity:0; background:linear-gradient(180deg,transparent,#54f7ff55,transparent),repeating-linear-gradient(180deg,transparent 0 24px,#ffffff44 25px 28px); transform:translateY(100%); }
    .rise.show { animation:rise 1.35s cubic-bezier(.12,.78,.2,1) both; }
    .controls { position:absolute; inset:auto 0 0; min-height:116px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:14px 18px; border-top:2px solid #ffffff33; background:linear-gradient(#121631,#090b1c); }
    .charge-label { color:#9fb3ff; font:900 10px Arial,sans-serif; letter-spacing:.14em; }
    .charge-meter { height:9px; margin-top:10px; border:1px solid #ffffff55; border-radius:99px; overflow:hidden; background:#050614; }
    .charge-fill { width:0%; height:100%; background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink)); border-radius:inherit; transition:width .04s linear; }
    .fire { width:88px; height:88px; border:0; border-radius:50%; cursor:pointer; color:#180807; background:radial-gradient(circle at 38% 30%,#fff77a,#ffb000 58%,#d94800 60%); box-shadow:0 7px 0 #7d2300,0 0 22px #ffb000aa; touch-action:manipulation; user-select:none; }
    .fire.charging { transform:translateY(8px) scaleY(.86); filter:brightness(1.25); box-shadow:0 1px 0 #7d2300,0 0 30px #ffb000; }
    .fire:disabled { filter:grayscale(1) brightness(.55); cursor:default; }
    .cutin { position:fixed; inset:0; z-index:20; display:grid; place-items:center; pointer-events:none; opacity:0; color:#fff; font-size:clamp(54px,16vw,150px); text-align:center; font-style:italic; -webkit-text-stroke:3px #10121d; text-shadow:8px 8px 0 var(--pink),-5px -5px 0 var(--gold),0 0 36px #fff; }
    .cutin.show { animation:cutIn 1.1s cubic-bezier(.12,.85,.22,1) both; }
    @keyframes aura { to{transform:rotate(1turn)} } @keyframes spin{from{transform:translateY(-35%)}to{transform:translateY(35%)}} @keyframes rise{0%{opacity:0;transform:translateY(100%)}18%{opacity:1}100%{opacity:0;transform:translateY(-100%)}} @keyframes boardAscend{0%{transform:translateY(0);filter:blur(0)}42%{transform:translateY(38%);filter:blur(2px)}43%{transform:translateY(-42%);filter:blur(2px)}100%{transform:translateY(0);filter:blur(0)}} @keyframes cutIn{0%{opacity:0;transform:translateY(35vh) scale(.45) rotate(-6deg)}45%{opacity:1;transform:translateY(-3vh) scale(1.12) rotate(2deg)}100%{opacity:0;transform:translateY(-18vh) scale(1.25) rotate(-2deg)}}
    @media(max-width:900px){.cabinet{width:min(520px,100vw);height:100dvh;max-height:none}.reels{width:64%}}
    @media(max-width:560px){
      .stage{padding:0}
      .cabinet{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0}
      .hud{height:72px;padding:8px 10px;gap:6px}
      h1{font-size:clamp(23px,8vw,34px)}
      .stats{min-width:116px;font-size:10px;line-height:1.28;letter-spacing:.08em}
      .board{inset:72px 0 104px}
      .reels{top:34%;width:62%;gap:4px;padding:6px;border-width:2px}
      .symbol{font-size:clamp(28px,9vw,48px)}
      .message{top:56%;font-size:clamp(17px,6vw,29px)}
      .controls{min-height:104px;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}
      .charge-label{font-size:9px;letter-spacing:.08em}
      .fire{width:74px;height:74px;font-size:16px}
    }
    @media(max-height:700px){.hud{height:60px}.board{inset:60px 0 88px}.controls{min-height:88px;padding-top:8px;padding-bottom:8px}.fire{width:66px;height:66px}.stats{font-size:9px}.charge-meter{margin-top:6px}}
    @media(max-height:560px){h1{font-size:22px}.reels{width:52%;top:32%}.message{font-size:18px}.charge-label{font-size:8px}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="cabinet">
      <header class="hud">
        <h1>PachinCaz</h1>
        <div class="stats">STAGE <span id="stageNo">1</span><br>TIME <span id="timeLeft">90</span><br>BALLS <span id="balls">20</span><br>SCORE <span id="score">0000</span></div>
      </header>
      <div class="board" id="board">
        <canvas id="canvas"></canvas>
        <div class="reels"><div class="reel"><span class="symbol">⭐</span></div><div class="reel"><span class="symbol">7</span></div><div class="reel"><span class="symbol">⚡</span></div></div>
        <div class="rise" id="rise"></div>
        <div class="message" id="message">HOLD FIRE</div>
      </div>
      <div class="controls">
        <div class="charge-label">HOLD TO CHARGE / RELEASE TO LAUNCH<div class="charge-meter"><div class="charge-fill" id="chargeFill"></div></div></div>
        <button class="fire" id="fireButton" type="button">FIRE</button>
      </div>
    </section>
  </main>
  <div class="cutin" id="cutin"></div>
  <script>
    "use strict";
    const STATE={READY:"ready",BALL:"ball",REEL:"reel",ASCEND:"ascend",OVER:"over"};
    const SYMBOLS=["⭐","7","🔥","💎","⚡","🌙"];
    const canvas=document.querySelector("#canvas"), ctx=canvas.getContext("2d"), board=document.querySelector("#board");
    const reels=[...document.querySelectorAll(".reel")], symbols=[...document.querySelectorAll(".symbol")];
    const stageNoText=document.querySelector("#stageNo"), ballsText=document.querySelector("#balls"), scoreText=document.querySelector("#score"), timeLeftText=document.querySelector("#timeLeft");
    const fireButton=document.querySelector("#fireButton"), chargeFill=document.querySelector("#chargeFill"), message=document.querySelector("#message"), cutin=document.querySelector("#cutin"), rise=document.querySelector("#rise");
    let width=0,height=0,last=performance.now(),state=STATE.READY,stage=1,balls=20,score=0,ball=null,activeBalls=[],slotQueue=0,pins=[],bumpers=[],tulips=[],warps=[],waterZones=[],fans=[],splitOrbs=[],enemies=[],boss=null,particles=[],chargeStart=0,chargeFrame=0,charging=false,reelTimer=0,audio=null,bgmTimer=0,bgmStep=0,bgmMode="",stageTimeLeft=90,hurryUp=false;
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    function resize(){const r=board.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);width=r.width;height=r.height;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);buildStage();}
    function buildStage(){ball=null;activeBalls=[];slotQueue=0;pins=[];bumpers=[];tulips=[];warps=[];waterZones=[];fans=[];splitOrbs=[];enemies=[];boss=null;particles=[];hurryUp=false;stageTimeLeft=getStageLimit();const gate=getGate();if(stage===1){buildStageOnePins(gate);}else{for(let row=0;row<5+Math.min(stage,4);row++){const count=row%2?6:5;const y=height*(.14+row*.07);for(let i=0;i<count;i++){const x=width*.24+i*(width*.66/(count-1));if(!(y>height*.24&&y<height*.45&&x>width*.18&&x<width*.86))pins.push({x,y,r:5,guide:0});}}for(let row=0;row<Math.min(stage,5);row++){const y=height*(.58+row*.045),spread=width*(.28-row*.035),count=5-row%2;for(let i=0;i<count;i++){const x=gate.x-spread+i*(spread*2/(count-1));pins.push({x,y,r:5,guide:x<gate.x?1:-1});}}}if(Math.random()<.7)splitOrbs.push({x:width*(.36+Math.random()*.28),y:height*(.4+Math.random()*.16),r:14,hue:Math.floor(Math.random()*80)+285});if(stage>=2){tulips=[{x:width*.27,y:height*.84},{x:width*.73,y:height*.84}];}if(stage>=3){bumpers=[{x:width*.24,y:height*.51,r:13},{x:width*.76,y:height*.51,r:13}];}if(stage>=4){warps=[{x:width*.82,y:height*.28,outX:width*.58,outY:height*.58},{x:width*.18,y:height*.64,outX:width*.43,outY:height*.2}];}if(stage>=5){waterZones=[{x:width*.2,y:height*.47,w:width*.34,h:height*.16}];}if(stage>=6){fans=[{x:width*.72,y:height*.63,w:width*.16,h:height*.2,fx:-7,fy:-3,label:"WIND"}];}if(stage>=7){waterZones.push({x:width*.55,y:height*.2,w:width*.28,h:height*.14});fans.push({x:width*.22,y:height*.31,w:width*.13,h:height*.24,fx:6,fy:-5,label:"JET"});}spawnEnemies();if(stage%3===0)spawnBoss();if(audio)startBgm(stage%3===0&&boss&&boss.alive?"boss":"normal");setStats();}
    function buildStageOnePins(gate){for(let row=0;row<5;row++){const count=5+row%2,y=height*(.18+row*.08);for(let i=0;i<count;i++){const x=width*.28+i*(width*.58/(count-1));pins.push({x,y,r:4.5,guide:x<gate.x?-1.1:1.1});}}for(let i=0;i<4;i++){const t=i/3;pins.push({x:gate.x-width*(.32-.17*t),y:gate.y-height*(.22-.03*t),r:4.5,guide:-1.4});pins.push({x:gate.x+width*(.32-.17*t),y:gate.y-height*(.22-.03*t),r:4.5,guide:1.4});}pins.push({x:gate.x-gate.r*1.35,y:gate.y-gate.r*.75,r:5.5,guide:-2.8});pins.push({x:gate.x+gate.r*1.35,y:gate.y-gate.r*.75,r:5.5,guide:2.8});}
    function spawnBoss(){const maxHp=10+stage*4;boss={x:width*.5,y:height*.2,cx:width*.5,cy:height*.2,rx:width*.22,ry:height*.055,r:34+Math.min(stage,9),hp:maxHp,maxHp,phase:Math.random()*6.28,hue:(stage*47)%360,hitFlash:0,alive:true};}
    function spawnEnemies(){enemies=[{x:width*.36,y:height*.2,cx:width*.38,cy:height*.24,rx:width*.18,ry:height*.1,r:16,phase:Math.random()*6.28,speed:.28,sides:3,hue:190,alive:true,respawnAt:0,spawnFlash:0},{x:width*.68,y:height*.56,cx:width*.64,cy:height*.58,rx:width*.2,ry:height*.13,r:18,phase:Math.random()*6.28,speed:.22,sides:5,hue:315,alive:true,respawnAt:0,spawnFlash:0}];}
    function spawnHurryEnemies(){while(enemies.length<6){const i=enemies.length,side=3+i%4;enemies.push({x:width*(.25+Math.random()*.58),y:height*(.16+Math.random()*.58),cx:width*(.25+Math.random()*.58),cy:height*(.18+Math.random()*.58),rx:width*(.1+Math.random()*.12),ry:height*(.07+Math.random()*.08),r:14+Math.random()*6,phase:Math.random()*6.28,speed:.24+Math.random()*.14,sides:side,hue:(60+i*57)%360,alive:true,respawnAt:0,spawnFlash:1});}}
    function getStageLimit(){return Math.max(70,105-stage*3);}
    function getGate(){return{x:width/2,y:height*.73,r:width*.08};}
    function getBaseNeed(){return 24+stage*6;}
    function getNeed(){return getBaseNeed()+(stage%3===0&&boss&&boss.alive?999:0);}
    function setStats(){stageNoText.textContent=stage;ballsText.textContent=balls;scoreText.textContent=String(score).padStart(4,"0");timeLeftText.textContent=Math.ceil(stageTimeLeft);}
    function getAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();return audio;}
    function tone(f,d=.1,t="sine",v=.06,delay=0){const a=getAudio(),s=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d);}
    function playReelAppearSound(){tone(880,.08,"sine",.07);tone(1175,.1,"sine",.07,.06);tone(1568,.16,"triangle",.065,.13);}
    function playStageJingle(){tone(660,.08,"triangle",.06);tone(880,.08,"triangle",.06,.08);tone(1175,.1,"triangle",.065,.16);tone(1568,.18,"sine",.06,.26);}
    function startBgm(mode){if(bgmMode===mode&&bgmTimer)return;clearInterval(bgmTimer);bgmMode=mode;bgmStep=0;const normal=[220,247,294,330,392,330,294,247],bossScale=[110,131,147,165,196,220,196,165],hurry=[330,392,440,523,587,659,587,523];bgmTimer=setInterval(()=>{if(state===STATE.OVER){clearInterval(bgmTimer);return;}if(bgmMode==="hurry"){const n=hurry[bgmStep%hurry.length];tone(n,.1,"square",.045);if(bgmStep%2===0)tone(82,.12,"sine",.085);if(bgmStep%4===3)tone(988,.05,"sine",.04);}else if(bgmMode==="boss"){const n=bossScale[bgmStep%bossScale.length];tone(n,.18,"sawtooth",.035);if(bgmStep%2===0)tone(55,.22,"sine",.07);if(bgmStep%8===4)tone(330,.08,"square",.045);}else{const n=normal[bgmStep%normal.length];tone(n,.26,"sine",.018);if(bgmStep%4===0)tone(65,.2,"sine",.045);}bgmStep++;},bgmMode==="hurry"?120:bgmMode==="boss"?180:280);}
    function showCutin(text){cutin.textContent=text;cutin.className="cutin";void cutin.offsetWidth;cutin.className="cutin show";}
    function draw(){ctx.clearRect(0,0,width,height);drawLane();drawPins();drawGimmicks();drawBoss();drawEnemies();drawParticles();drawGate();drawAscendLine();for(const item of activeBalls)drawBall(item);}
    function drawLane(){const x=width*.1;ctx.save();ctx.strokeStyle="#54f7ffaa";ctx.lineWidth=5;ctx.shadowColor="#54f7ff";ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(x-24,height-18);ctx.lineTo(x-24,42);ctx.quadraticCurveTo(x-24,12,x+18,12);ctx.lineTo(width*.36,12);ctx.moveTo(x+24,height-18);ctx.lineTo(x+24,64);ctx.quadraticCurveTo(x+24,36,x+56,36);ctx.lineTo(width*.31,36);ctx.stroke();ctx.fillStyle="#ffd84d";ctx.font="900 10px Arial";ctx.textAlign="center";ctx.fillText("LAUNCH",x,height-36);ctx.restore();}
    function drawPins(){for(const p of pins){ctx.fillStyle="#dffcff";ctx.shadowColor="#54f7ff";ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}
    function drawGimmicks(){for(const z of waterZones){ctx.save();ctx.fillStyle="#2bdcff33";ctx.strokeStyle="#54f7ffcc";ctx.lineWidth=2;ctx.shadowColor="#54f7ff";ctx.shadowBlur=12;roundZone(z.x,z.y,z.w,z.h,18);ctx.fill();ctx.stroke();ctx.fillStyle="#dffcff";ctx.font="900 11px Arial";ctx.textAlign="center";ctx.fillText("ZERO-G WATER",z.x+z.w/2,z.y+18);ctx.restore();}for(const f of fans){ctx.save();ctx.fillStyle="#ffffff22";ctx.strokeStyle="#33ff99";ctx.lineWidth=3;ctx.shadowColor="#33ff99";ctx.shadowBlur=12;roundZone(f.x,f.y,f.w,f.h,10);ctx.stroke();ctx.fillStyle="#33ff99";ctx.font="900 10px Arial";ctx.textAlign="center";ctx.fillText(f.label,f.x+f.w/2,f.y+16);for(let i=0;i<5;i++){const y=f.y+32+i*(f.h-42)/4;ctx.beginPath();ctx.moveTo(f.x+f.w*.18,y);ctx.lineTo(f.x+f.w*.82,y+Math.sin(performance.now()/180+i)*5);ctx.stroke();}ctx.restore();}for(const b of bumpers){ctx.fillStyle="#ff2d75";ctx.shadowColor="#ff2d75";ctx.shadowBlur=18;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}for(const o of splitOrbs){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(performance.now()/700);ctx.strokeStyle=`hsl(${o.hue},100%,70%)`;ctx.fillStyle=`hsla(${o.hue},100%,60%,.24)`;ctx.lineWidth=3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-o.r*.7,0);ctx.lineTo(o.r*.7,0);ctx.moveTo(0,-o.r*.7);ctx.lineTo(0,o.r*.7);ctx.stroke();ctx.restore();}const open=Math.floor(performance.now()/1300)%3!==0;for(const t of tulips){ctx.save();ctx.translate(t.x,t.y);ctx.strokeStyle=open?"#ff6fae":"#8a315b";ctx.lineWidth=5;ctx.shadowColor=open?"#ff2d75":"transparent";ctx.shadowBlur=open?14:0;ctx.beginPath();ctx.moveTo(-8,10);ctx.quadraticCurveTo(open?-34:-12,open?-17:-15,open?-22:-5,open?-34:-29);ctx.moveTo(8,10);ctx.quadraticCurveTo(open?34:12,open?-17:-15,open?22:5,open?-34:-29);ctx.stroke();ctx.restore();}for(const w of warps){ctx.strokeStyle="#33ff99";ctx.lineWidth=4;ctx.shadowColor="#33ff99";ctx.shadowBlur=16;ctx.beginPath();ctx.arc(w.x,w.y,16,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}}
    function roundZone(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);}
    function drawGate(){const g=getGate();ctx.strokeStyle="#ffd84d";ctx.lineWidth=5;ctx.shadowColor="#ffd84d";ctx.shadowBlur=14;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#54f7ff";ctx.font="900 13px Arial";ctx.textAlign="center";ctx.fillText("SLOT GATE",g.x,g.y-12);}
    function drawEnemies(){for(const e of enemies){if(!e.alive)continue;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(performance.now()/650+e.phase);const scale=e.spawnFlash>0?1+e.spawnFlash*.65:1;ctx.scale(scale,scale);ctx.strokeStyle=`hsl(${e.hue},100%,65%)`;ctx.fillStyle=`hsla(${e.hue},100%,55%,.18)`;ctx.lineWidth=4;ctx.shadowColor=`hsl(${e.hue},100%,65%)`;ctx.shadowBlur=16+e.spawnFlash*24;ctx.beginPath();for(let i=0;i<e.sides;i++){const a=-Math.PI/2+i*Math.PI*2/e.sides;const x=Math.cos(a)*e.r,y=Math.sin(a)*e.r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}}
    function drawBoss(){if(!boss||(!boss.alive&&!boss.dying))return;ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(performance.now()/900+boss.phase);const sinkScale=boss.dying?Math.max(.25,1-boss.deathProgress*.45):1;const scale=sinkScale+boss.hitFlash*.18;ctx.scale(scale,scale);ctx.globalAlpha=boss.dying?Math.max(.25,1-boss.deathProgress*.55):1;ctx.strokeStyle=boss.hitFlash>0?"#fff":`hsl(${boss.hue},100%,65%)`;ctx.fillStyle=`hsla(${boss.hue},100%,45%,.22)`;ctx.lineWidth=6;ctx.shadowColor=`hsl(${boss.hue},100%,65%)`;ctx.shadowBlur=24+boss.hitFlash*30;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?boss.r*.62:boss.r,x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=1;ctx.restore();if(!boss.dying){const barW=width*.48,barH=8,x=boss.x-barW/2,y=boss.y+boss.r+15;ctx.fillStyle="#170713";ctx.fillRect(x,y,barW,barH);ctx.fillStyle="#ff2d75";ctx.fillRect(x,y,barW*(boss.hp/boss.maxHp),barH);ctx.strokeStyle="#ffd84d";ctx.strokeRect(x,y,barW,barH);ctx.fillStyle="#ffd84d";ctx.font="900 11px Arial";ctx.textAlign="center";ctx.fillText(`BOSS ${boss.hp}/${boss.maxHp}`,boss.x,y-5);}}
    function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
    function drawAscendLine(){const bossLock=stage%3===0&&boss&&boss.alive,need=getBaseNeed();ctx.strokeStyle=!bossLock&&balls>=need?"#33ff99":"#ffd84d88";ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(width*.18,height*.9);ctx.lineTo(width*.82,height*.9);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=!bossLock&&balls>=need?"#33ff99":"#ffd84d";ctx.font="900 12px Arial";ctx.textAlign="center";ctx.fillText(bossLock?`DEFEAT BOSS / ${need} BALLS`:`ASCEND AT ${need} BALLS`,width/2,height*.9-8);}
    function drawBall(item){ctx.fillStyle=item.bonus?"#fff6b0":"#fff";ctx.shadowColor=item.bonus?"#ffd84d":"#fff";ctx.shadowBlur=14;ctx.beginPath();ctx.arc(item.x,item.y,item.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
    function startCharge(e){if(state!==STATE.READY||balls<=0||charging)return;e.preventDefault();const firstAudio=!audio;getAudio();if(firstAudio)playStageJingle();startBgm(stage%3===0&&boss&&boss.alive?"boss":"normal");charging=true;chargeStart=performance.now();fireButton.classList.add("charging");fireButton.setPointerCapture?.(e.pointerId);tone(90,.55,"sawtooth",.04);updateCharge();}
    function updateCharge(){if(!charging)return;const ratio=Math.min(1,(performance.now()-chargeStart)/750);chargeFill.style.width=`${ratio*100}%`;fireButton.textContent=`${Math.round(ratio*100)}%`;chargeFrame=requestAnimationFrame(updateCharge);}
    function releaseCharge(e){if(!charging)return;e.preventDefault();const ratio=Math.min(1,(performance.now()-chargeStart)/750);charging=false;cancelAnimationFrame(chargeFrame);chargeFill.style.width="0%";fireButton.textContent="FIRE";fireButton.classList.remove("charging");launchBall(ratio);}
    function launchBall(ratio){if(state!==STATE.READY||balls<=0)return;balls--;setStats();state=STATE.BALL;fireButton.disabled=true;message.textContent="";const x=width*.1,power=17+ratio*8+Math.pow(ratio,4)*13;ball={x,y:height-32,r:7,vx:0,vy:-power,inLane:true,exit:false,life:0,drag:.994+Math.random()*.004,bounce:.78+Math.random()*.14,drift:(Math.random()-.5)*.14};activeBalls.push(ball);tone(180,.08,"square",.08);}
    function updateBall(dt){if(!ball||state!==STATE.BALL)return;ball.life+=dt;let gravity=49,extraDrag=1;if(stage===1&&!ball.inLane&&ball.y>height*.5&&Math.abs(ball.x-width/2)<width*.28&&Math.hypot(ball.vx,ball.vy)<1.15){ball.vx+=(width/2-ball.x)*dt*.9;ball.vy+=18*dt;}for(const z of waterZones){if(ball.x>z.x&&ball.x<z.x+z.w&&ball.y>z.y&&ball.y<z.y+z.h){gravity=7;extraDrag*=.965;ball.vx+=Math.sin(performance.now()/240+ball.y*.03)*.05;}}for(const f of fans){if(ball.x>f.x&&ball.x<f.x+f.w&&ball.y>f.y&&ball.y<f.y+f.h){ball.vx+=f.fx*dt;ball.vy+=f.fy*dt;}}ball.vy+=gravity*dt;ball.vx+=ball.drift*dt;const drag=Math.pow(ball.drag,dt*60)*Math.pow(extraDrag,dt*60);ball.vx*=drag;ball.vy*=drag;ball.x+=ball.vx*60*dt;ball.y+=ball.vy*60*dt;const lx=width*.1,left=lx-24+ball.r,right=lx+24-ball.r;if(ball.inLane){if(!ball.exit){ball.x+=(lx-ball.x)*Math.min(1,dt*18);ball.vx*=.72;if(ball.x<left)ball.x=left;if(ball.x>right)ball.x=right;if(ball.y<35){ball.y=35;ball.exit=true;ball.vx=Math.max(7.5,Math.abs(ball.vy)*.58);ball.vy=-1.8;}}else{const p=Math.min(1,(ball.x-lx)/(width*.19)),gy=26+Math.sin(p*Math.PI)*7;ball.y+=(gy-ball.y)*Math.min(1,dt*20);ball.vx=Math.max(ball.vx,5.2);ball.vy*=.75;if(ball.x>width*.3){ball.inLane=false;ball.vy=2.2+Math.random()*1.2;ball.vx*=.55;}}}else{collideWalls();if(!ball)return;collidePins();if(!ball)return;collideGimmicks();if(!ball)return;collideEnemies();if(!ball)return;checkGate();}if(ball&&ball.y>height+24)endBall();if(ball&&ball.life>18)endBall();}
    function moveEnemies(dt){const nowMs=performance.now(),now=nowMs/1000;for(const e of enemies){if(!e.alive){if(e.respawnAt&&nowMs>=e.respawnAt){e.alive=true;e.respawnAt=0;e.spawnFlash=1;tone(520,.08,"sine",.05);tone(780,.08,"sine",.04,.04);}else{continue;}}const a=now*e.speed+e.phase;e.x=e.cx+Math.cos(a)*e.rx;e.y=e.cy+Math.sin(a*1.35)*e.ry;e.x=Math.max(width*.22,Math.min(width*.86,e.x));e.y=Math.max(height*.13,Math.min(height*.78,e.y));if(e.spawnFlash>0)e.spawnFlash=Math.max(0,e.spawnFlash-dt*2.2);}if(boss&&boss.alive){const a=now*.18+boss.phase;boss.x=boss.cx+Math.cos(a)*boss.rx;boss.y=boss.cy+Math.sin(a*1.5)*boss.ry;if(boss.hitFlash>0)boss.hitFlash=Math.max(0,boss.hitFlash-dt*3.2);}if(boss&&boss.dying){boss.deathProgress=Math.min(1,boss.deathProgress+dt*.42);boss.y+=22*dt;boss.x+=Math.sin(now*12)*16*dt;boss.deathBurstTimer-=dt;if(boss.deathBurstTimer<=0){smallBossExplosion();boss.deathBurstTimer=.22+Math.random()*.18;}if(boss.deathProgress>=1){explodeBoss();boss.dying=false;boss.alive=false;balls+=10;score+=2000;setStats();showCutin("BOSS DOWN +10");startBgm("normal");tone(220,.18,"square",.1);tone(440,.18,"square",.08,.12);tone(880,.35,"square",.08,.24);}}}
    function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt*1.7;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=18*dt;if(p.life<=0)particles.splice(i,1);}}
    function updateStageTimer(dt){if(state===STATE.ASCEND||state===STATE.REEL||state===STATE.OVER)return;stageTimeLeft=Math.max(0,stageTimeLeft-dt);if(!hurryUp&&stageTimeLeft<=0){hurryUp=true;spawnHurryEnemies();showCutin("HURRY UP");message.textContent="TIME UP PRESSURE";if(audio)startBgm("hurry");tone(988,.12,"square",.08);tone(740,.12,"square",.08,.1);}setStats();}
    function collideWalls(){const inner=width*.1+24;if(ball.x-ball.r<inner&&ball.y>42){ball.x=inner+ball.r;ball.vx=Math.abs(ball.vx)*ball.bounce;}if(ball.x+ball.r>width-18){ball.x=width-18-ball.r;ball.vx=-Math.abs(ball.vx)*ball.bounce;}if(ball.y-ball.r<8){ball.y=8+ball.r;ball.vy=Math.abs(ball.vy)*ball.bounce;}}
    function collidePins(){for(const p of pins){const dx=ball.x-p.x,dy=ball.y-p.y,dist=Math.hypot(dx,dy),min=ball.r+p.r;if(dist<min&&dist>0){const nx=dx/dist,ny=dy/dist;ball.x=p.x+nx*min;ball.y=p.y+ny*min;const dot=ball.vx*nx+ball.vy*ny;ball.vx=(ball.vx-2*dot*nx)*ball.bounce;ball.vy=(ball.vy-2*dot*ny)*ball.bounce;ball.vx+=(Math.random()-.5)*1.1;if(p.guide)ball.vx+=p.guide*.8;score+=5;setStats();tone(650+Math.random()*350,.035,"sine",.04);}}}
    function splitOrb(o){splitOrbs=splitOrbs.filter(item=>item!==o);for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5+(Math.random()-.5)*.3,s=3.8+Math.random()*2.4;activeBalls.push({x:o.x,y:o.y,r:6,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,inLane:false,exit:true,life:0,drag:.994+Math.random()*.004,bounce:.78+Math.random()*.14,drift:(Math.random()-.5)*.14,bonus:true});}for(let i=0;i<32;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*3,life:.45+Math.random()*.4,color:`hsl(${o.hue+Math.random()*45},100%,70%)`});}score+=250;setStats();showCutin("ORB BURST x5");tone(660,.12,"square",.08);tone(990,.16,"sine",.07,.08);tone(1320,.2,"triangle",.06,.16);}
    function collideGimmicks(){for(const b of bumpers){const dx=ball.x-b.x,dy=ball.y-b.y,dist=Math.hypot(dx,dy),min=ball.r+b.r;if(dist<min&&dist>0){const nx=dx/dist,ny=dy/dist;ball.x=b.x+nx*min;ball.y=b.y+ny*min;const dot=ball.vx*nx+ball.vy*ny;ball.vx=(ball.vx-2*dot*nx)*1.05+nx*1.5;ball.vy=(ball.vy-2*dot*ny)*1.05+ny*1.5;score+=25;setStats();tone(900,.05,"square",.06);}}for(const o of splitOrbs){if(Math.hypot(ball.x-o.x,ball.y-o.y)<ball.r+o.r){splitOrb(o);return;}}const open=Math.floor(performance.now()/1300)%3!==0;for(const t of tulips){if(open&&ball.vy>0&&Math.abs(ball.x-t.x)<25&&ball.y>t.y-34&&ball.y<t.y+18){balls+=2;score+=100;setStats();showCutin("+2 BALLS");tone(1040,.12,"square",.07);endBall();return;}}for(const w of warps){if(Math.hypot(ball.x-w.x,ball.y-w.y)<22){ball.x=w.outX;ball.y=w.outY;ball.vx=(Math.random()-.5)*5;ball.vy=2;showCutin("WARP");tone(330,.08,"sawtooth",.07);}}}
    function collideEnemies(){if(!ball)return;if(boss&&boss.alive&&!boss.dying){const dx=ball.x-boss.x,dy=ball.y-boss.y,dist=Math.hypot(dx,dy),min=ball.r+boss.r;if(dist<min&&dist>0){const nx=dx/dist,ny=dy/dist;ball.x=boss.x+nx*min;ball.y=boss.y+ny*min;const speed=Math.max(5,Math.hypot(ball.vx,ball.vy));ball.vx=nx*speed*.95+(Math.random()-.5)*2.2;ball.vy=ny*speed*.95+(Math.random()-.5)*2.2;boss.hp--;boss.hitFlash=1;score+=80;setStats();tone(110,.08,"sawtooth",.1);tone(360,.08,"square",.06,.04);if(boss.hp<=0){boss.dying=true;boss.deathProgress=0;boss.deathBurstTimer=.05;showCutin("BOSS BREAK");tone(90,.45,"sawtooth",.12);}return;}}for(const e of enemies){if(!ball)return;if(!e.alive)continue;const dx=ball.x-e.x,dy=ball.y-e.y,dist=Math.hypot(dx,dy),min=ball.r+e.r;if(dist<min&&dist>0){const nx=dx/dist,ny=dy/dist;ball.x=e.x+nx*min;ball.y=e.y+ny*min;const speed=Math.max(4,Math.hypot(ball.vx,ball.vy));const angle=Math.atan2(ball.vy,ball.vx)+(Math.random()-.5)*1.35;ball.vx=Math.cos(angle)*speed*.9+nx*2.5;ball.vy=Math.sin(angle)*speed*.9+ny*2.5;explodeEnemy(e);e.alive=false;e.respawnAt=performance.now()+4500+Math.random()*2500;score+=150;setStats();showCutin("+150");tone(180,.08,"sawtooth",.09);tone(720,.12,"square",.06,.04);return;}}}
    function explodeEnemy(e){for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,s=1.2+Math.random()*4.2;particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*3,life:.6+Math.random()*.45,color:`hsl(${e.hue+Math.random()*50},100%,65%)`});}}
    function smallBossExplosion(){if(!boss)return;const ox=(Math.random()-.5)*boss.r*1.5,oy=(Math.random()-.5)*boss.r*1.2;for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4.8;particles.push({x:boss.x+ox,y:boss.y+oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*4,life:.45+Math.random()*.35,color:`hsl(${boss.hue+Math.random()*70},100%,65%)`});}tone(80+Math.random()*80,.09,"sawtooth",.08);}
    function explodeBoss(){if(!boss)return;for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,s=1.8+Math.random()*7.5;particles.push({x:boss.x,y:boss.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*5,life:.8+Math.random()*.7,color:`hsl(${boss.hue+Math.random()*80},100%,65%)`});}}
    function checkGate(){const g=getGate();if(ball.vy>0&&ball.y>g.y-12&&ball.y<g.y+g.r&&Math.abs(ball.x-g.x)<g.r*.75){slotQueue++;message.textContent=`SLOT QUEUE x${slotQueue}`;endBall();}}
    function beginReels(){document.querySelector(".reels").classList.add("show");playReelAppearSound();reels.forEach(r=>r.className="reel spin");reelTimer=setInterval(()=>symbols.forEach(s=>s.textContent=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]),80);tone(120,.3,"sawtooth",.035);}
    function stopReel(i,v){reels[i].className="reel lock";symbols[i].textContent=v;tone(280+i*90,.09,"square",.07);}
    async function startReelEvent(){state=STATE.REEL;message.textContent=`SLOT CHANCE ${slotQueue+1}`;beginReels();await wait(650);const target=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];stopReel(0,target);await wait(420);const reach=Math.random()<(stage>=3?.86:.7);stopReel(1,reach?target:SYMBOLS.find(x=>x!==target));await wait(420);if(reach){showCutin("REACH");tone(330,.2,"sawtooth",.07);await wait(650);}const jackpot=reach&&Math.random()<(stage>=5?.62:.38);stopReel(2,jackpot?target:SYMBOLS.find(x=>x!==target));clearInterval(reelTimer);if(jackpot){const plus=target==="7"?12:6;balls+=plus;score+=target==="7"?1200:500;showCutin(target==="7"?"+12 BALLS":"+6 BALLS");message.textContent=target==="7"?"7 JACKPOT":"JACKPOT";tone(523,.2,"square",.08);tone(784,.2,"square",.08,.12);tone(1047,.35,"square",.08,.24);}else{message.textContent=reach?"NEAR MISS":"MISS";tone(180,.28,"triangle",.06);}setStats();await wait(900);document.querySelector(".reels").classList.remove("show");await wait(300);if(slotQueue>0){slotQueue--;startReelEvent();}else finishVolley();}
    async function endBall(){if(ball)activeBalls=activeBalls.filter(item=>item!==ball);ball=null;if(activeBalls.length)return;if(slotQueue>0){slotQueue--;startReelEvent();return;}finishVolley();}
    async function finishVolley(){if(activeBalls.length||slotQueue||state===STATE.ASCEND)return;if(balls>=getNeed()){await ascendStage();return;}if(balls<=0){state=STATE.OVER;fireButton.disabled=true;message.textContent="GAME OVER";return;}state=STATE.READY;fireButton.disabled=false;message.textContent=`STAGE ${stage}: ${stageText()} / ${stage%3===0&&boss&&boss.alive?"DEFEAT BOSS":`ASCEND AT ${getBaseNeed()} BALLS`}`;}
    function stageText(){return stage%3===0?"BOSS BATTLE":stage===1?"PINS":stage===2?"TULIPS":stage===4?"WARP GATES":stage===5?"ZERO-G WATER":stage===7?"WATER + JET":"HIGH JACKPOT RATE";}
    async function ascendStage(){const clearedNeed=getBaseNeed();state=STATE.ASCEND;fireButton.disabled=true;showCutin("STAGE UP");rise.classList.remove("show");board.classList.remove("level-scroll");void rise.offsetWidth;rise.classList.add("show");board.classList.add("level-scroll");tone(330,.18,"square",.08);tone(494,.18,"square",.08,.12);tone(660,.26,"square",.08,.24);await wait(650);stage++;balls-=Math.floor(clearedNeed*.3);balls+=8;if(balls<10)balls=10;buildStage();setStats();playStageJingle();message.textContent=`STAGE ${stage}: ${stageText()}`;await wait(850);board.classList.remove("level-scroll");await wait(350);state=STATE.READY;fireButton.disabled=false;message.textContent=`${stageText()} / ${stage%3===0&&boss&&boss.alive?"DEFEAT BOSS":`ASCEND AT ${getBaseNeed()} BALLS`}`;}
    function frame(now){const dt=Math.min((now-last)/1000,.025);last=now;updateStageTimer(dt);moveEnemies(dt);updateParticles(dt);if(state===STATE.BALL){for(const item of [...activeBalls]){if(state!==STATE.BALL)break;ball=item;updateBall(dt);}ball=null;}draw();requestAnimationFrame(frame);}
    fireButton.addEventListener("pointerdown",startCharge);fireButton.addEventListener("pointerup",releaseCharge);fireButton.addEventListener("pointercancel",releaseCharge);fireButton.addEventListener("lostpointercapture",releaseCharge);
    addEventListener("resize",resize);resize();setStats();message.textContent=`STAGE ${stage}: ${stageText()} / ASCEND AT ${getBaseNeed()} BALLS`;requestAnimationFrame(frame);
  </script>
</body>
